services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soa_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?Set GATEWAY_DB_PASSWORD in .env}
      SINHVIEN_DB_PASSWORD: ${SINHVIEN_DB_PASSWORD:?Set SINHVIEN_DB_PASSWORD in .env}
      DETAI_DB_PASSWORD: ${DETAI_DB_PASSWORD:?Set DETAI_DB_PASSWORD in .env}
      DANGKY_DB_PASSWORD: ${DANGKY_DB_PASSWORD:?Set DANGKY_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/initialize-databases.sh:/docker-entrypoint-initdb.d/01-initialize-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [soa]
    security_opt:
      - no-new-privileges:true

  sinhvien-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: services/sinhvien-service
        APP_JAR_PATH: services/sinhvien-service/target/sinhvien-service-1.0.0.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://database:5432/sinhvien
      DATABASE_USERNAME: sinhvien_user
      DATABASE_PASSWORD: ${SINHVIEN_DB_PASSWORD:?Set SINHVIEN_DB_PASSWORD in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [soa]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  detai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: services/detai-service
        APP_JAR_PATH: services/detai-service/target/detai-service-1.0.0.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://database:5432/detai
      DATABASE_USERNAME: detai_user
      DATABASE_PASSWORD: ${DETAI_DB_PASSWORD:?Set DETAI_DB_PASSWORD in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
    expose: ["8082"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [soa]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  dangky-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: services/dangky-service
        APP_JAR_PATH: services/dangky-service/target/dangky-service-1.0.0.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8083
      DATABASE_URL: jdbc:postgresql://database:5432/dangky
      DATABASE_USERNAME: dangky_user
      DATABASE_PASSWORD: ${DANGKY_DB_PASSWORD:?Set DANGKY_DB_PASSWORD in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      SINHVIEN_SERVICE_URL: http://sinhvien-service:8081
      DETAI_SERVICE_URL: http://detai-service:8082
    depends_on:
      database:
        condition: service_healthy
      sinhvien-service:
        condition: service_healthy
      detai-service:
        condition: service_healthy
    expose: ["8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [soa]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: gateway
        APP_JAR_PATH: gateway/target/admin-gateway-1.0.0.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://database:5432/gateway
      DATABASE_USERNAME: gateway_user
      DATABASE_PASSWORD: ${GATEWAY_DB_PASSWORD:?Set GATEWAY_DB_PASSWORD in .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Set APP_ADMIN_USERNAME in .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      SINHVIEN_SERVICE_URL: http://sinhvien-service:8081
      DETAI_SERVICE_URL: http://detai-service:8082
      DANGKY_SERVICE_URL: http://dangky-service:8083
    depends_on:
      database:
        condition: service_healthy
      sinhvien-service:
        condition: service_healthy
      detai-service:
        condition: service_healthy
      dangky-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [soa]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  soa:
    driver: bridge
