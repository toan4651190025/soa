spring.application.name=dangky-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/dangky;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.internal-key=${INTERNAL_SERVICE_KEY:soa-demo-internal-key-change-me}
services.sinhvien.url=${SINHVIEN_SERVICE_URL:http://localhost:8081}
services.detai.url=${DETAI_SERVICE_URL:http://localhost:8082}