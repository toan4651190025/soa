spring.application.name=admin-gateway
server.port=${SERVER_PORT:8080}
spring.datasource.url=${GATEWAY_DATASOURCE_URL:jdbc:h2:file:./data/gateway;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${GATEWAY_DATASOURCE_USERNAME:sa}
spring.datasource.password=${GATEWAY_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.internal-key=${INTERNAL_SERVICE_KEY:soa-demo-internal-key-change-me}
services.sinhvien.url=${SINHVIEN_SERVICE_URL:http://localhost:8081}
services.detai.url=${DETAI_SERVICE_URL:http://localhost:8082}
services.dangky.url=${DANGKY_SERVICE_URL:http://localhost:8083}